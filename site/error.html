<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Not Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f0ead9;
    --ink: #191510;
    --accent: #d64526;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(25,21,16,0.08) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    border-bottom: 3px solid var(--ink);
    padding: 1.1rem 2rem;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 780px;
    margin: 0 auto;
    padding: 3rem 2rem;
    width: 100%;
  }
  .code {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(6rem, 22vw, 12rem);
    line-height: 0.85;
    margin: 0;
    color: var(--ink);
    position: relative;
    display: inline-block;
  }
  .code::after {
    content: '';
    position: absolute;
    left: 0.1em;
    bottom: 0.12em;
    width: 2.4em;
    height: 5px;
    background: var(--accent);
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.6rem;
    margin: 1.6rem 0 0.6rem;
  }
  p {
    font-size: 1rem;
    line-height: 1.6;
    max-width: 42ch;
    color: rgba(25,21,16,0.75);
  }
  a.back {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 2rem;
    color: var(--ink);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 2px;
    width: fit-content;
    transition: gap 0.2s ease;
  }
  a.back:hover { gap: 0.85rem; }
  footer {
    border-top: 3px solid var(--ink);
    padding: 1rem 2rem;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
  <header>S3 / Static Hosting</header>

  <main>
    <div class="code">404</div>
    <h1>This page never made it to the bucket.</h1>
    <p>
      Whatever you were looking for either moved, was never uploaded, or
      the key just doesn't match. Objects in S3 are exact — no partial
      matches, no guessing.
    </p>
    <a class="back" href="/">&larr; Back to the site</a>
  </main>

  <footer>
